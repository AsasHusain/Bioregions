[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoregions"
version = "0.1.0"
description = "Biotic Regions of the World: regions of native plant and animal communities"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}

[project.scripts]
ecoregions = "ecoregions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
