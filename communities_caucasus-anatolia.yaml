# Caucasus & Anatolia (Turkiye, Armenia, Azerbaijan, Georgia): the Pakistan, Afghanistan & Iran library plus
# communities drafted from the literature before any GBIF record of the area was read (Zohary 1973; Davis, Flora of
# Turkey, phytogeographical introduction; Mayer & Aksoy 1986, Walder der Turkei; Atalay 2014, Ecoregions of Turkey;
# Kurschner & Parolly 2012; Nakhutsrishvili 2013, Vegetation of Georgia; Fayvush & Aleksanyan 2016, Habitats of Armenia;
# Prilipko 1970, Azerbaijan; Zazanashvili et al. 2000). New rules are limited to provinces 60-75 or the Iranian
# provinces that continue here (27 Talysh, 30 Hakkari). Thresholds are first guesses, to be calibrated on development
# records (sealed squares excluded).
include: [communities_pak-afg-irn.yaml]
# Species the audit does not count as indicators here (audit only, never the map): listed under one Iranian or Asian
# type in the shared library but widespread in Euxine, Colchic and Anatolian vegetation, or along every watercourse
# (Central Asia's audit showed the effect). Set 2026-11-14 from ranges in the literature, before any record was read.
audit_ignore: [Tamarix ramosissima, Elaeagnus angustifolia, Celtis australis, Populus alba, Salix alba, Cornus mas,
  Quercus petraea, Festuca valesiaca, Festuca ovina, Puccinellia distans, Alnus glutinosa, Fraxinus angustifolia,
  Nymphaea alba, Trapa natans, Schoenoplectus lacustris, Schoenoplectus litoralis, Ceratophyllum demersum,
  Imperata cylindrica, Diospyros lotus, Pterocarya fraxinifolia, Zelkova carpinifolia, Acer cappadocicum,
  Fagus orientalis, Sorbus torminalis, Berberis integerrima, Cotoneaster nummularius, Hippophae rhamnoides,
  Myricaria germanica, Crataegus azarolus]

# Communities, types and fallbacks: all in communities_pak-afg-irn.yaml since 2026-11-17, one rule list for every
# area, so the same ground is classified the same way on both sides of a seam.
